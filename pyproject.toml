[project]
name = "fuany-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
fuany = "mini_cc:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "cache",
    "config",
    "llm",
    "log",
    "mini_cc",
    "registry",
    "skills",
    "state",
]
packages = ["tools"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.16",
]
